[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@~3.0.12
  adafruit/Adafruit GFX Library@^1.11.11

; Normal firmware: WiFi + TCP frame client.
[env:ledwall]

; Wiring check: colour bars, grid and corner markers, no networking.
[env:paneltest]
build_flags = -DPANEL_TEST

; Same as ledwall, flashed over WiFi (pio run -e ota -t upload).
[env:ota]
upload_protocol = espota
upload_port = ledwall.local
upload_flags = --auth=ledwall
