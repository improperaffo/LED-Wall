[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; The panel's driver chips are FM6353 (S-PWM, on-chip frame memory): the mainline
; ESP32-HUB75-MatrixPanel-DMA can't drive them. lib/ holds the LAutour ICN2053/FM6353
; fork (github.com/LAutour/ESP32-HUB75-MatrixPanel-DMA-ICN2053, main @ 2023-06),
; patched so its DMA interrupt survives flash-cache-off periods (see esp32_i2s_parallel_v2.cpp).
lib_deps =
  adafruit/Adafruit GFX Library@^1.11.11
build_flags =
  -DMATRIX_WIDTH=128 -DMATRIX_HEIGHT=64 -DPANEL_COUNT_WIDTH=1 -DPANEL_COUNT_HEIGHT=1
  -DDISABLE_SERIAL_DEBUG

; Normal firmware: WiFi + TCP frame client.
[env:ledwall]

; Wiring check: colour bars, grid and corner markers, no networking.
[env:paneltest]
build_flags = ${env.build_flags} -DPANEL_TEST

; Same as ledwall, flashed over WiFi. Only works from the 5G LAN; from the laptop use ./ota.sh
[env:ota]
upload_protocol = espota
upload_port = ledwall.local
upload_flags = --auth=ledwall
