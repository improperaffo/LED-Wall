[server]
host = "0.0.0.0"
port = 7777

[location]
plz = 1024            # MeteoSwiss forecast point (Ecublens)
lat = 46.5265
lon = 6.5610

[brightness]          # 0-255 sent to the panel
day = 100
night = 20
night_start = "22:00"
night_end = "07:00"

[rotation]            # [screen, seconds]; screens without data are skipped
screens = [["clock", 10], ["weather", 15], ["forecast", 10], ["flights", 15]]

[flights]
radius_km = 15        # aircraft considered at all
poll_s = 15
alert_km = 6          # a new aircraft this close and low interrupts the rotation
alert_max_alt_ft = 15000
