[server]
host = "0.0.0.0"
port = 7777
web_port = 8080       # control page: http://<host>:8080


[panel]               # physical LEDs; screens draw at 64x32 and are scaled up
width = 128
height = 64

[location]
plz = 1024            # MeteoSwiss forecast point (Ecublens)
lat = 46.5265
lon = 6.5610

[brightness]          # 0-255 sent to the panel
day = 255
night = 90
night_start = "22:00"
night_end = "07:00"

[rotation]            # first-run defaults only; afterwards the control page's settings apply
screens = [["clock", 10], ["weather", 15], ["forecast", 10], ["flights", 15]]

[flights]
poll_s = 15
alert_km = 6          # a new aircraft this close and low interrupts the rotation
alert_max_alt_ft = 15000
